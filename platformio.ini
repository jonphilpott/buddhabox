[common]
platform = ststm32@15.4.1
board = blackpill_f401cc
framework = arduino
upload_protocol = dfu
build_flags =
    -O2
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON

; Original generative ambient patch.
; Build:  pio run -e buddhabox
; Flash:  pio run -e buddhabox -t upload
[env:buddhabox]
extends = common
src_filter = +<*> -<plank.cpp>

; Plank — second application patch.
; Build:  pio run -e plank
; Flash:  pio run -e plank -t upload
[env:plank]
extends = common
src_filter = +<*> -<main.cpp>
